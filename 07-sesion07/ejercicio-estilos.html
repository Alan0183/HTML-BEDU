<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria</title>
    <link rel="stylesheet" href="./scss/main.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="#" class="nav__link">Inicio</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Menu</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Nosotros</a></li>
                <li class="nav__item"><a href="#" class="nav__link">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="main">
        <section class="hero">
            <h1 class="hero__titule">Bienvenido a Café Delicioso</h1>
            <p class="hero__subtitule">Descubre el arte del caf'e perfecto</p>
            <a href="#" class="btn btn--primary">Ver Menú</a>
        </section>
        <section class="featured-products">
            <h2 class="section-titule">Nuestros Cafés Destacados</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/200x200" alt="Café Expresso">
                    <h3 class="product-card_titule">Expresso Clásico</h3>
                    <p class="product-card_price">120.50</p>
                    <button class="btn btn--secondary">Agregar al Carrito</button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>Café Delicioso, Todos los derechos reservados</p>
    </footer>
</body>
</html>
