<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .col-demo{
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb4">Ejercicio de Rejilla Bootstrap</h1>
        <div class="row mb-4">
            <div class="col-sm-4">
                <div class="col-demo bg-primary text-white">Columna 1</div>
            </div>
            <div class="col-sm-4">
                <div class="col-demo bg-secondary text-white">Columna 1</div>
            </div>
            <div class="col-sm-4">
                <div class="col-demo bg-success text-white">Columna 1</div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-sm-8">
                <div class="col-demo bg-info">Columna Ancha (8)</div>
            </div>
            <div class="col-sm-4">
                <div class="col-demo bg-warning">Columana estrecha (4)</div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-sm-6">
                <div class="col-demo bg-danger text-white">
                    Columna principal
                    <div class="row mt-2">
                        <div class="col-6">
                            <div class="col-demo bg-light text-dark">Anidad 1</div>
                        </div>
                        <div class="col-6">
                            <div class="col-demo bg-dark text-white">Anidad 2</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-demo bg-info text-white">Columna principal</div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="col-demo bg-primary text-white">Responsive</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="col-demo bg-secondary text-white">Responsive</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="col-demo bg-success text-white">Responsive</div>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="col-demo bg-info text-white">Responsive</div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
