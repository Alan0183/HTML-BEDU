<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .texto-boton {
  font-size: 1rem;
  height: 100%;
  padding: 6px 20px;
  margin-left: -10px;
  color: #fff;
  background-color: #025157;
  border-radius: 8px;
  border: none;
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
  position: relative;
  overflow: hidden;
}

.texto-boton span {
  position: relative;
  z-index: 2;
}

.texto-boton.uno::after {
  content: " ";
  width: 100%;
  height: 100%;
  background: #67b54b;
  position: absolute;
  top: -100%;
  left: 0;
  z-index: 1;
  transition: 0.3s ease-in-out all;
}

.texto-boton.uno:hover::after {
  top: 0;
}
    </style>
</head>
<body>
    <button type="submit" class="texto-boton uno">
        <span>Try it now &rarr;</span>
    </button>
</body>
</html>
