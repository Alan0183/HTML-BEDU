<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Encabezado</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: #f8f9fa;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img{
            height: 50px;
        }

        nav ul{
            list-style: none;
            padding: 0;
            display: flex;

       }
       nav ul li{
        margin-right: 1rem;
       }
       nav ul li a{
        text-decoration: none;
        color: #333;
       }

       .user-actions button{
        background-color: #007bff;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
       }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo"><img src="https://via.placeholder.com/150*50" alt=""></a>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button>Inicar Sesion</button>
        </div>
    </header>
</body>
</html>
