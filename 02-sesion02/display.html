<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .container{
            width: 80%;
            margin: 0 auto;
            border: 1px solid #333;
            padding: 20px;
        }

        .inline-element{
            background-color: #3498db;
            color: white;
            padding: 5px;
        }
        .block-element{
            background-color: #e74c3c;
            color: white;
            padding: 18px;
            margin: 10px 0px;
        }

        .inline-bloc-element{
            display: inline-block;
            background-color: #2ecc2e;
            color: white;
            padding: 10px;
            margin: 5px;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ejercicio Display</h1>
        <h2>Elementos de línea</h2>
        <p>Este <span class="inline-element">parrafo</span> es un <span class="inline-element">elemento de línea</span></p>

        <h2>Elementos de bloque</h2>
        <div class="block-element">Este div es un elemento de bloque</div>
        <div class="block-element">Este div es un elemento de bloque</div>

        <h2>Elementos inline-block</h2>
        <div class="inline-block-element">1</div>
        <div class="inline-block-element">2</div>
        <div class="inline-block-element">3</div>
    </div>
</body>
</html>
