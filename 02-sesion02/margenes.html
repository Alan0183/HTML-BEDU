<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Márgenes</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .container{
            width: 80%;
            margin: 0 auto;
            border: 1px solid #333;
            padding: 20px;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: #3498db;
            display: inline-block;
        }
        #box1{
            margin: 20px;
        }
        #box2{
            margin-top: 30px;
            margin-right: 15px;
            margin-bottom: 10px;
            margin-left: 25px;
        }
        #box3{
            margin: 15px 25px;
        }
        #box4{
            margin: 10px 20px 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ejercicio de márgenes</h1>
        <p>Observa como se aplica diferentes márgenes a cada caja</p>

        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>

        <h2>Tarea</h2>

        <ol>
            <li>Diferencia entre los márgenes de cada caja</li>
            <li>Modifica los margenes para crear un nuevo diseño</li>
            <li>Crea una nueva caja y aplica un margen negativo</li>
        </ol>
    </div>
</body>
</html>
